<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión – Sistema RRHH</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efefef;
    --surface: #ffffff;
    --surface2: #f5f5f5;
    --border: #e0e0e0;
    --accent: #c0392b;
    --accent-hover: #a93226;
    --text: #1a1a1a;
    --muted: #888;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 44px 40px;
    width: 100%; max-width: 400px;
    box-shadow: 0 2px 24px rgba(0,0,0,.07);
    animation: fadeUp .4s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-icon {
    width: 36px; height: 36px; background: var(--accent);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .logo-text { font-size: 1.1rem; font-weight: 700; }
  .logo-text span { color: var(--accent); }
  .heading { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
  .subheading { color: var(--muted); font-size: .875rem; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: flex; align-items: center; gap: 5px;
    font-size: .78rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
  }
  .field label svg { width: 12px; height: 12px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  input {
    width: 100%; background: var(--surface2);
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 11px 14px; color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: .92rem;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,57,43,.1); background: #fff; }
  .btn {
    width: 100%; background: var(--accent); border: none; border-radius: 8px;
    padding: 12px; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: .95rem; font-weight: 600; cursor: pointer; margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s, transform .15s;
  }
  .btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .error-msg {
    background: rgba(192,57,43,.07); border: 1px solid rgba(192,57,43,.2);
    color: var(--accent); border-radius: 8px; padding: 10px 14px;
    font-size: .85rem; margin-bottom: 14px;
    align-items: center; gap: 8px; display: none;
  }
  .error-msg svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .6s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="logo-text">Sistema <span>RRHH</span></div>
  </div>
  <div class="heading">Bienvenido</div>
  <div class="subheading">Ingresá tus credenciales para continuar</div>

  <div class="error-msg" id="errorMsg">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errorText"></span>
  </div>

  <div class="field">
    <label>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Usuario
    </label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="field">
    <label>
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Contraseña
    </label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="btnLogin" onclick="login()">
    <div class="spinner" id="spinner"></div>
    <svg id="btnIcon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Iniciar sesión
  </button>
</div>
<script>
  const API = 'https://sistema-rrhh-production.up.railway.app/api';
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    document.getElementById('errorMsg').style.display = 'none';
    if (!username || !password) { showError('Completá todos los campos.'); return; }
    btn.disabled = true;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('btnIcon').style.display = 'none';
    try {
      const res = await fetch(`${API}/usuarios/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.detail || 'Credenciales incorrectas.'); return; }
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('nombre', data.nombre_completo);
      localStorage.setItem('roles', JSON.stringify(data.roles));
      window.location.href = 'dashboard.html';
    } catch { showError('No se pudo conectar con el servidor.'); }
    finally {
      btn.disabled = false;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnIcon').style.display = 'block';
    }
  }
  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').style.display = 'flex';
  }
</script>
</body>
</html>
